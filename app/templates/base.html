<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{% block title %}{{ settings.APP_NAME }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="header no-print">
    <div class="container header-content">
      <a href="/" class="brand">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/>
            <path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/>
          </svg>
        </div>
        <div>
          <div class="brand-title">{{ settings.APP_NAME }}</div>
          <div class="brand-subtitle">Red Local Autónomo &bull; Sin Internet</div>
        </div>
      </a>
      
      <div style="display: flex; align-items: center; gap: 0.75rem;">
        <span class="badge-offline">
          <span class="dot-pulse"></span>
          Portal WiFi Activo
        </span>
        <a href="/admin" class="btn btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">
          Admin / Taquilla
        </a>
      </div>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <div id="toast-container" class="toast-container no-print"></div>

  {% block scripts %}{% endblock %}
</body>
</html>
