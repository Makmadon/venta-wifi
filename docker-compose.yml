services:
  ticketing-portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wifi-ticketing-portal
    restart: unless-stopped

    # CRITICAL: "host" network mode allows the container to bind directly
    # to physical interfaces (e.g., wlan0, eth0) to handle L2 DHCP broadcasts
    # (ports 67/68 UDP) and DNS wildcard queries (port 53 UDP) without NAT isolation.
    network_mode: "host"

    # CRITICAL: NET_ADMIN capability gives the container permission to
    # execute iptables port-forwarding (80 -> 8000) and configure the interface IP.
    cap_add:
      - NET_ADMIN
      - NET_RAW

    environment:
      # Network interface providing upstream Internet connection (WAN)
      - WAN_INTERFACE=eth0
      # Network interface where clients connect (Hotspot Wi-Fi / AP)
      - HOTSPOT_INTERFACE=wlan0
      # Server IP, default gateway and captive portal target
      - HOST_IP=192.168.4.1
      - NETMASK=255.255.255.0
      - DHCP_START=192.168.4.50
      - DHCP_END=192.168.4.200
      # Set to 'false' if testing in dev mode without managing system network
      - ENABLE_NETWORK_SETUP=false
      # Cryptographic secret
      - SECRET_KEY=offline-secure-portal-key-2026-production
      # Persistent SQLite database path mapped to the volume below
      - DATABASE_URL=sqlite:////app/data/tickets.db

    volumes:
      # Persists SQLite database, sales records, and events across container restarts
      - ./data:/app/data
